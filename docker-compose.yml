services:
  fastapi-backend:
    build: .
    container_name: vpn-backend
    restart: always
    ports:
      - "8880:8000"
    environment:
      - TZ=Asia/Singapore
      - ADMIN_AUTH_ENABLED=${ADMIN_AUTH_ENABLED:-false}
      - ADMIN_API_KEY=${ADMIN_API_KEY:-}
      - ALLOW_LEGACY_DEVICE_AUTH=${ALLOW_LEGACY_DEVICE_AUTH:-false}
      - ENABLE_UNVERIFIED_NATIVE_RECHARGE=${ENABLE_UNVERIFIED_NATIVE_RECHARGE:-false}
      - HUPIJIAO_APP_ID=${HUPIJIAO_APP_ID:-}
      - HUPIJIAO_APP_SECRET=${HUPIJIAO_APP_SECRET:-}
      - RESIDENTIAL_PROXY_ENCRYPTION_KEY=${RESIDENTIAL_PROXY_ENCRYPTION_KEY:-}
      - RESIDENTIAL_PROXY_KEY_FILE=/app/secrets/residential_proxy.key
      - RESIDENTIAL_XRAY_SYNC_ENABLED=${RESIDENTIAL_XRAY_SYNC_ENABLED:-true}
      - RESIDENTIAL_PROXY_TEST_URL=${RESIDENTIAL_PROXY_TEST_URL:-https://ip.oxylabs.io/location}
    volumes:
      - ./vpn_data.db:/app/vpn_data.db
      - residential-secrets:/app/secrets
      - /etc/localtime:/etc/localtime:ro

volumes:
  residential-secrets:
